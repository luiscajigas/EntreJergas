<section class="page">
  <div class="page-head">
    <h1>{{ i18n.t('history.heading') }}</h1>
    <p>{{ i18n.t('history.subheading') }}</p>
  </div>
  @if (activity.history().length) {
    <ul class="history-list">
      @for (item of activity.history(); track item.id) {
        <li>
          <button class="history-row" type="button" (click)="repeat(item)">
            <span class="history-expression">{{ item.expression }}</span>
            <span class="status-badge tone-{{ item.source }}"
              ><app-icon [name]="statuses[item.source].icon" />{{
                i18n.t(statuses[item.source].label)
              }}</span
            >
            <span class="history-date">{{
              item.createdAt | date: 'd MMM, HH:mm' : undefined : i18n.language()
            }}</span>
            <app-icon class="row-arrow" name="arrow" />
          </button>
        </li>
      }
    </ul>
  } @else {
    <div class="empty-state">
      <strong>{{ i18n.t('history.empty.title') }}</strong>
      <p>{{ i18n.t('history.empty.text') }}</p>
      <a class="text-button" routerLink="/"
        ><app-icon name="search" />{{ i18n.t('history.empty.button') }}</a
      >
    </div>
  }
</section>
